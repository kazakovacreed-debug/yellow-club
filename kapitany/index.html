*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8EEEB;font-family:Inter,system-ui,sans-serif;color:#0B0838;padding:20px}
.box{background:#fff;border-radius:28px;padding:36px 30px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(110,42,156,.12);text-align:center}

p{color:#6b6580;margin:0 0 22px}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:2px solid #F1E4E1;border-radius:14px;outline:none;text-align:center}
input:focus{border-color:#E0475B}
button{margin-top:12px;width:100%;font:inherit;font-weight:800;font-size:17px;padding:14px;border:0;border-radius:14px;color:#fff;background:linear-gradient(90deg,#F28C28,#E0475B 55%,#6E2A9C);cursor:pointer}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:14px;color:#6b6580}
.err{color:#E0475B;font-weight:600;min-height:22px;margin-top:10px}

async function open(pw){
  const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);

  document.open();document.write(t);document.close();
}
